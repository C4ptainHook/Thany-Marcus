name: cloud-ci

on:
  push:
    branches: [main]
    paths:
      - 'src/ThanyMarcus.Cloud.Api/**'
      - 'src/ThanyMarcus.Shared/**'
      - 'infra/docker/cloud/Dockerfile'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/cloud-ci.yml'
  workflow_dispatch:

concurrency:
  group: cloud-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: build + push cloud-api image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/cloud/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/thany-cloud-api:latest
            ghcr.io/${{ github.repository_owner }}/thany-cloud-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
