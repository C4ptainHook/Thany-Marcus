name: cloud-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloud-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: cache nuget
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: restore
        run: dotnet restore ThanyMarcus.slnx

      - name: build
        run: dotnet build ThanyMarcus.slnx -c Release --no-restore

      - name: test cloud
        run: |
          dotnet run \
            --project tests/ThanyMarcus.Cloud.Tests \
            -c Release --no-build --no-restore

  build-and-push:
    name: build + push cloud-api
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/cloud/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/thany-cloud-api:latest
            ghcr.io/${{ env.OWNER_LC }}/thany-cloud-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
