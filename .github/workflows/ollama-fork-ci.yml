name: ollama-fork-ci

on:
  workflow_dispatch:
    inputs:
      fork_sha:
        description: 'tc-mb/ollama commit SHA on MiniCPM-V branch'
        required: false
        default: 'd12fda49fac50c5e420886bfc0ac58070b23b193'

concurrency:
  group: ollama-fork-ci
  cancel-in-progress: false

# tc-mb/ollama MiniCPM-V branch — carries OpenBMB's MiniCPM-V 4.6 patches
# that upstream Ollama has not merged (PR #12078 was closed unmerged).
# Built CPU-only; cloud VMs run Standard_B2ms without a GPU.
jobs:
  build-and-push:
    name: build + push ollama-minicpm
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout repo (for ollama-fork.Dockerfile)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: checkout fork at pinned sha
        uses: actions/checkout@v4
        with:
          repository: tc-mb/ollama
          ref: ${{ github.event.inputs.fork_sha || 'd12fda49fac50c5e420886bfc0ac58070b23b193' }}
          path: ollama-fork

      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: resolve short sha
        run: |
          SHA="${{ github.event.inputs.fork_sha || 'd12fda49fac50c5e420886bfc0ac58070b23b193' }}"
          echo "FORK_SHA_SHORT=${SHA:0:12}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v5
        with:
          context: ollama-fork
          file: repo/infra/docker/cloud/ollama-fork.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/thany-ollama-minicpm:minicpm-v-${{ env.FORK_SHA_SHORT }}
            ghcr.io/${{ env.OWNER_LC }}/thany-ollama-minicpm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
