name: portal-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: cache nuget
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: restore
        run: dotnet restore ThanyMarcus.slnx

      - name: build
        run: dotnet build ThanyMarcus.slnx -c Release --no-restore

      - name: test
        run: bash scripts/test.sh
