apiVersion: v1
kind: Service
metadata:
  name: n8n-editor
  namespace: backend
  labels:
    app: n8n-editor
spec:
  type: ClusterIP
  ports:
  - port: 5678
    targetPort: 5678
    name: http
  selector:
    app: n8n-editor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-editor
  namespace: backend
  labels:
    app: n8n-editor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n-editor
  template:
    metadata:
      labels:
        app: n8n-editor
    spec:
      containers:
      - name: n8n
        image: n8nio/n8n:latest
        ports:
        - containerPort: 5678
          name: http
        env:
        - name: EXECUTIONS_MODE
          value: "queue"
        - name: QUEUE_BULL_REDIS_HOST
          value: "redis"
        - name: QUEUE_BULL_REDIS_PORT
          value: "6385"
        - name: DB_TYPE
          value: "postgresdb"
        - name: DB_POSTGRESDB_HOST
          value: "postgres"
        - name: DB_POSTGRESDB_PORT
          value: "5432"
        - name: DB_POSTGRESDB_DATABASE
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: DB_POSTGRESDB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-secret
              key: N8N_ENCRYPTION_KEY
        - name: N8N_EDITOR_BASE_URL
          value: "https://nginx.thany.click"
        - name: WEBHOOK_URL
          value: "https://nginx.thany.click/"
        - name: N8N_PORT
          value: "5678"
        - name: N8N_PROTOCOL
          value: "http"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 30
          periodSeconds: 10
