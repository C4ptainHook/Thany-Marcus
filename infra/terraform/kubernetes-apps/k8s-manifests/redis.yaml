apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: backend
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
  - port: 6385
    targetPort: 6385
    name: redis
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: backend
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:8.0.5-alpine
        command: ["redis-server", "--port", "6385"]
        ports:
        - containerPort: 6385
          name: redis
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          tcpSocket:
            port: 6385
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6385
          initialDelaySeconds: 5
          periodSeconds: 5
