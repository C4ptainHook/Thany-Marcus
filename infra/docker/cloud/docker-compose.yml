services:
  caddy:
    image: caddy:2.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - cloud-api

  cloud-api:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - cert-status:/etc/nginx/cert-status:ro
    environment:
      CLOUD_ID: ${CLOUD_ID}

  cert-watcher:
    image: alpine:3.19
    restart: unless-stopped
    command: >
      sh -c "apk add --no-cache inotify-tools jq >/dev/null &&
             mkdir -p /shared &&
             printf '{\"cert_ready\":false,\"cloud_id\":\"%s\",\"registration_status\":\"pending\"}' \"$$CLOUD_ID\" > /shared/cert-status &&
             while ! ls /caddy-certs/acme-v02.api.letsencrypt.org-directory/$$DOMAIN/$$DOMAIN.crt 2>/dev/null &&
                   ! ls /caddy-certs/acme-staging-v02.api.letsencrypt.org-directory/$$DOMAIN/$$DOMAIN.crt 2>/dev/null; do
               sleep 2
             done &&
             printf '{\"cert_ready\":true,\"cloud_id\":\"%s\",\"registration_status\":\"pending\"}' \"$$CLOUD_ID\" > /shared/cert-status &&
             tail -f /dev/null"
    volumes:
      - caddy-data:/caddy-certs:ro
      - cert-status:/shared
    environment:
      CLOUD_ID: ${CLOUD_ID}
      DOMAIN: ${DOMAIN}

volumes:
  caddy-data:
  caddy-config:
  cert-status:
